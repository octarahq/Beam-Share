name: Release Linux App

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Upload Linux Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'linux-cli'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Build BeamShare
        run: go build -v -o beamshare

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: beamshare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
